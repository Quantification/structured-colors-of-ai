name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: write is REQUIRED for the OIDC token exchange
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish with Trusted Publishing (no PAT)
        run: npx --yes @vscode/vsce publish --oidc
